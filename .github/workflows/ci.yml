name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . ruff

      - name: Lint
        run: ruff check webstation_broker

      # Catches the failure mode that actually bites: a bad import or syntax
      # error only surfacing when s6 restarts the service in the container.
      - name: Build the app
        run: python -c "from webstation_broker.app import create_app; create_app()"
